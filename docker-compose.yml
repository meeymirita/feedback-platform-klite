# ─────────────────────────────────────────────────────────────
# Производственный стек: PostgreSQL + Redis + backend (NestJS) + frontend (Caddy).
# Запуск:  docker compose up --build -d
# Точка входа:  https://localhost:${HTTPS_PORT:-8443}
#              (HTTP на :${HTTP_PORT:-8080} редиректит на HTTPS)
# ─────────────────────────────────────────────────────────────
name: meeymirita-feedback-platform-klite

services:
  # ── База данных ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: meeymirita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-full-authorization}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - meeymirita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-full-authorization}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [meeymirita-net]

  # ── Redis (хранилище сессий) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: meeymirita-redis
    restart: unless-stopped
    # appendonly — сессии переживают перезапуск; requirepass — пароль как в backend/.env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-pass123456}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - meeymirita_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pass123456}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [meeymirita-net]

  # ── API ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    image: meeymirita/feedback-klite-backend:latest
    container_name: meeymirita-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # NODE_ENV=production → app.module.ts ставит ignoreEnvFile:true,
      # переменные берутся отсюда, а не из backend/.env
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Europe/Moscow}
      APPLICATION_PORT: 3000
      APPLICATION_URL: http://localhost:3000
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://meeymirita.localhost:8443}
      COOKIES_SECRET: ${COOKIES_SECRET:-dev_insecure_cookies_change_me}
      # Хосты — имена сервисов compose; порты внутренние (5432 / 6379)
      POSTGRES_URI: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-full-authorization}
      REDIS_URI: redis://default:${REDIS_PASSWORD:-pass123456}@redis:6379
    ports:
      # Прямой доступ к API в обход Caddy — удобно для отладки/Postman
      - "${APPLICATION_PORT:-3000}:3000"
    init: true
    networks: [meeymirita-net]

  # ── Веб / реверс-прокси / TLS (Caddy) ─────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    image: meeymirita/feedback-klite-frontend:latest
    container_name: meeymirita-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # localhost → внутренний CA Caddy; реальный домен → Let's Encrypt/ZeroSSL
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${HTTP_PORT:-8080}:80"     # HTTP: редирект на HTTPS + ACME-челлендж
      - "${HTTPS_PORT:-8443}:443"   # HTTPS: точка входа приложения
    volumes:
      - meeymirita_caddy_data:/data      # сертификаты и состояние ACME (persist!)
      - meeymirita_caddy_config:/config  # автосохранённая конфигурация Caddy
    networks: [meeymirita-net]

volumes:
  meeymirita_pgdata:
  meeymirita_redisdata:
  meeymirita_caddy_data:
  meeymirita_caddy_config:

networks:
  meeymirita-net:
    driver: bridge
