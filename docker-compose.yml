# ─────────────────────────────────────────────────────────────
# Производственный стек: PostgreSQL + Redis + backend (NestJS) + frontend (Caddy).
# Запуск:  docker compose up --build -d
# Точка входа:  https://localhost:${HTTPS_PORT:-8443}
#              (HTTP на :${HTTP_PORT:-8080} редиректит на HTTPS)
# ─────────────────────────────────────────────────────────────
name: meeymirita-feedback-platform-klite

services:
  # ── База данных ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: meeymirita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reports}
      POSTGRES_USER: ${POSTGRES_USER:-mira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mira}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meeymirita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mira} -d ${POSTGRES_DB:-reports}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [meeymirita-net]

  # ── Redis (хранилище сессий) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: meeymirita-redis
    restart: unless-stopped
    # appendonly — сессии переживают перезапуск контейнера
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - meeymirita_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [meeymirita-net]

  # ── API ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    image: meeymirita/feedback-klite-backend:latest
    container_name: meeymirita-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mira:mira@postgres:5432/reports}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-reports}
      POSTGRES_USER: ${POSTGRES_USER:-mira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mira}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COOKIES_SECRET: ${COOKIES_SECRET:-dev_insecure_cookies_change_me}
      SESSION_SECRET: ${SESSION_SECRET:-dev_insecure_session_change_me}
      SESSION_TTL: ${SESSION_TTL:-86400}
      JWT_SECRET: ${JWT_SECRET:-dev_insecure_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_insecure_refresh_change_me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    ports:
      # Прямой доступ к API в обход Caddy — удобно для отладки/Postman
      - "${BACKEND_PORT:-3000}:3000"
    init: true
    networks: [meeymirita-net]

  # ── Веб / реверс-прокси / TLS (Caddy) ─────────────────────
  frontend:
    build:
      context: ./frontend
      target: production
    image: meeymirita/feedback-klite-frontend:latest
    container_name: meeymirita-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # localhost → внутренний CA Caddy; реальный домен → Let's Encrypt/ZeroSSL
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${HTTP_PORT:-8080}:80"     # HTTP: редирект на HTTPS + ACME-челлендж
      - "${HTTPS_PORT:-8443}:443"   # HTTPS: точка входа приложения
    volumes:
      - meeymirita_caddy_data:/data      # сертификаты и состояние ACME (persist!)
      - meeymirita_caddy_config:/config  # автосохранённая конфигурация Caddy
    networks: [meeymirita-net]

volumes:
  meeymirita_pgdata:
  meeymirita_redisdata:
  meeymirita_caddy_data:
  meeymirita_caddy_config:

networks:
  meeymirita-net:
    driver: bridge
